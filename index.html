:root{
  --ink:#111;--muted:#8a8a8a;--line:#e6e6e6;--bg:#fff;
  --lav:#ACA2F4;--blue:#5C70D3;--pink:#EBBDC4;--green:#6CBB80;--yellow:#F8D873;--orange:#EF865E;--beige:#BEB1A1;--red:#E8503A;
  --gap:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Elisava Sans',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
.wrap{padding:0 24px 80px}

/* header */
header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);z-index:20}
.brand{display:flex;align-items:center;gap:14px;cursor:pointer}
.brand img{height:24px;display:block}
.brand span{font-size:22px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:34px;font-size:22px;color:var(--muted)}
.nav button{color:var(--muted)}
.nav button:hover,.nav .on{color:var(--ink)}
.avisos{position:relative;color:var(--red)!important;display:flex;align-items:center;gap:8px}
.avisos .dot{width:18px;height:18px;border-radius:50%;background:var(--red);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700}
.avisos.none{color:var(--muted)!important}.avisos.none .dot{background:#d6d6d6;color:transparent}
.drop{position:absolute;right:0;top:44px;width:380px;background:#fff;border:1px solid var(--ink);display:none;text-align:left;color:var(--ink);font-size:17px;max-height:420px;overflow:auto}
.drop.open{display:block}
.drop .n{padding:14px 16px;border-bottom:1px solid var(--line);line-height:1.3}
.drop .n small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.drop .n.unread{background:#faf7ef}
.drop .empty{padding:18px 16px;color:var(--muted)}

/* type */
h1.hero{font-weight:400;font-size:clamp(64px,11.5vw,190px);letter-spacing:-.045em;line-height:.9;margin:56px 0 30px}
h1.page{font-weight:400;font-size:clamp(52px,7.5vw,120px);letter-spacing:-.04em;line-height:.92;margin:48px 0 22px}
p.lead{font-size:clamp(24px,3vw,46px);line-height:1.12;letter-spacing:-.02em;max-width:1500px;margin-bottom:60px}
.sub{font-size:22px;color:var(--muted);margin-bottom:30px}

/* tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--gap)}
.grid.two{grid-template-columns:1fr 1fr}
.tile{position:relative;min-height:330px;padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .18s ease,filter .18s}
.tile:hover{filter:brightness(1.04);transform:translateY(-3px)}
.tile h3{font-weight:400;font-size:34px;line-height:1.05;letter-spacing:-.02em}
.tile .b{font-size:21px;line-height:1.2}
.tile .tag{font-size:16px;margin-bottom:10px;opacity:.75}
.tile.big{min-height:520px}
.tile.big h3{font-size:clamp(44px,5vw,84px);letter-spacing:-.035em;line-height:.95}
.tile.big .b{font-size:26px;max-width:520px}
.tile.ghost{border:1.5px dashed var(--ink);background:#fff}
.tile .meta{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.count{font-variant-numeric:tabular-nums;font-size:19px}
.stack{display:flex}
.av{width:34px;height:34px;border-radius:50%;border:2px solid currentColor;background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-left:-9px}
.stack .av:first-child{margin-left:0}
.stack .av{border-color:#fff}
.badge{position:absolute;top:16px;right:16px;font-size:14px;background:var(--ink);color:#fff;padding:5px 9px}
.badge.new{background:var(--red)}
.how .tile{min-height:220px}
.how .tile h3{font-size:28px}
.c-lav{background:var(--lav)}.c-blue{background:var(--blue)}.c-pink{background:var(--pink)}.c-green{background:var(--green)}.c-yellow{background:var(--yellow)}.c-orange{background:var(--orange)}.c-beige{background:var(--beige)}

/* chips & tabs */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.chip{border:1.5px solid var(--ink);padding:9px 16px;font-size:18px;background:#fff}
.chip.on{background:var(--ink);color:#fff}
.tabs{display:flex;gap:28px;font-size:24px;margin-bottom:26px;border-bottom:1px solid var(--line)}
.tabs button{padding:0 0 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--ink)}

/* sheet */
.sheet{position:fixed;inset:0;background:#fff;z-index:50;overflow:auto;display:none}
.sheet.open{display:block;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;position:sticky;top:0;background:#fff;z-index:2}
.x{font-size:22px;color:var(--muted)}.x:hover{color:var(--ink)}
.sheet-body{padding:0 24px 80px;display:grid;grid-template-columns:1.25fr 1fr;gap:56px}
.sheet-body.one{grid-template-columns:1fr}

/* form */
label.f{display:block;font-size:18px;color:var(--muted);margin:26px 0 10px}
.in{width:100%;border:0;border-bottom:1.5px solid var(--ink);padding:10px 0;font-size:28px;letter-spacing:-.01em;background:transparent;outline:none;border-radius:0}
textarea.in{resize:vertical;min-height:90px;font-size:24px;line-height:1.25}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px}
.hint{font-size:14px;color:var(--muted);margin-top:6px;text-align:right}
.tagpick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tagpick button{min-height:84px;padding:12px;text-align:left;font-size:19px;display:flex;align-items:flex-end;outline:2px solid transparent;outline-offset:2px}
.tagpick button.on{outline-color:var(--ink)}
.consent{display:flex;gap:14px;align-items:flex-start;font-size:19px;line-height:1.3;margin-top:18px;cursor:pointer}
.consent input{appearance:none;width:26px;height:26px;border:1.5px solid var(--ink);flex:none;margin-top:1px;cursor:pointer;display:grid;place-items:center}
.consent input:checked{background:var(--ink)}
.consent input:checked::after{content:'';width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.btn{background:var(--ink);color:#fff;padding:18px 28px;font-size:22px;margin-top:30px;display:inline-flex;gap:12px;align-items:center}
.btn:disabled{background:#cfcfcf;cursor:not-allowed}
.btn.light{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{padding:11px 18px;font-size:18px;margin-top:0}
.preview-wrap{position:sticky;top:90px;align-self:start}
.preview-wrap .lbl{font-size:16px;color:var(--muted);margin:26px 0 12px}

/* detail */
.dl{font-size:22px;line-height:1.35;max-width:880px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);margin:30px 0}
.facts div{padding:14px 14px 14px 0;font-size:24px}
.facts small{display:block;font-size:15px;color:var(--muted);margin-bottom:6px}
.clock{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:52px 1fr auto;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.app .av{width:52px;height:52px;font-size:17px;margin:0}
.app h4{font-weight:400;font-size:24px}
.app p{font-size:17px;color:#555;margin-top:3px;line-height:1.3}
.status{font-size:16px;padding:6px 10px;border:1.5px solid var(--ink);white-space:nowrap}
.status.sel{background:var(--green);border-color:var(--green)}
.status.no{color:var(--muted);border-color:var(--line)}
.empty-box{border:1.5px dashed #bbb;padding:40px;font-size:22px;color:var(--muted)}

/* dialog */
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.dlg.open{display:flex}
.dlg .box{background:#fff;max-width:620px;width:100%;padding:30px}
.dlg h2{font-weight:400;font-size:40px;letter-spacing:-.03em;line-height:1}
.dlg p{font-size:19px;line-height:1.35;margin-top:14px;color:#333}

.toast{position:fixed;bottom:24px;left:24px;background:var(--ink);color:#fff;padding:16px 20px;font-size:18px;z-index:90;transform:translateY(calc(100% + 60px));transition:transform .3s}
.toast.show{transform:none}
footer{padding:30px 24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:16px}
footer button{color:var(--muted);text-decoration:underline}

/* files */
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.file{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);padding:8px 12px;font-size:16px;background:#fff}
.file a{color:inherit;text-decoration:none}.file a[href]:hover{text-decoration:underline}

.locked{color:var(--muted);font-size:18px}

@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.chat-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.chat-head h3{font-weight:400;font-size:26px;letter-spacing:-.02em;line-height:1.05}
.chat-head p{font-size:15px;color:var(--muted);margin-top:4px}
.msgs{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:10px;background:#fafafa}
.msg{max-width:82%;padding:11px 14px;font-size:17px;line-height:1.3;background:#fff;border:1px solid var(--line);align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--lav);border-color:var(--lav)}
.msg small{display:block;font-size:12px;color:#666;margin-top:5px}
.msg .files{margin-top:8px}.msg .file{font-size:14px;padding:5px 8px}
.chat-in{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px;align-items:flex-end}

.chat-in .att{width:48px;height:48px;border:1.5px solid var(--ink);display:grid;place-items:center;font-size:20px;cursor:pointer}
.chat-in .att input{display:none}
.chat-in .send{height:48px;padding:0 18px;background:var(--ink);color:#fff;font-size:17px}
.pending{padding:0 12px 8px}
.chatbtn{position:relative}
.chatbtn .u{position:absolute;top:-7px;right:-7px;width:16px;height:16px;border-radius:50%;background:var(--red)}
/* people */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--gap)}
.person{border:1.5px solid var(--ink);display:flex;flex-direction:column;background:#fff;transition:transform .18s}
.person:hover{transform:translateY(-3px)}
.person.dim{opacity:.5}
.p-top{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 16px 0;width:100%}
.pav{width:72px;height:72px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--ink);flex:none}

.p-note{font-size:17px;line-height:1.3;margin-top:10px}

.tile .peek{position:absolute;inset:0;background:#fff;border:1.5px solid var(--ink);padding:18px 20px;display:flex;flex-direction:column;gap:10px;opacity:0;pointer-events:none;transition:opacity .18s}

/* ================= state ================= */
let S,route='home',draft={},chatCtx=null,chatFiles=[];
function load(){try{const r=localStorage.getItem('ebs_v1');S=r?JSON.parse(r):seed()}catch(e){S=seed()}}
function save(){try{localStorage.setItem('ebs_v1',JSON.stringify(S))}catch(e){toast('Browser storage is full. Remove some large files.')}}
load();

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const col=c=>'c-'+(CATS[c]?.c||'beige');
const eur=n=>'€'+Number(n).toLocaleString('en');
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
const fmtDate=t=>new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
function ago(t){const m=Math.round((Date.now()-t)/6e4);if(m<1)return'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<24)return h+' h ago';return Math.round(h/24)+' d ago'}
const PCOL=['var(--lav)','var(--green)','var(--yellow)','var(--pink)','var(--orange)','var(--beige)'];
function pcol(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))%997;return PCOL[h%PCOL.length]}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),3200)}
function notify(text,p){S.notes.unshift({text,at:Date.now(),read:false,p});save()}
const MAXF=3*1024*1024;
function readFiles(input,cb){const fs=[...input.files];input.value='';fs.forEach(f=>{if(f.size>MAXF){toast(f.name+' is over 3 MB (prototype limit)');return}const r=new FileReader();r.onload=()=>cb({name:f.name,size:f.size,type:f.type,data:r.result});r.readAsDataURL(f)})}
function fileList(files,rmFn){if(!files||!files.length)return'';return `<div class="files">${files.map((f,i)=>`<span class="file">${f.data?`<a href="${f.data}" download="${esc(f.name)}">`:'<a>'}📎 ${esc(f.name)} <small>${kb(f.size)}</small></a>${rmFn?`<button onclick="${rmFn}(${i})" title="Remove">✕</button>`:''}</span>`).join('')}</div>`}
function dropzone(id,onchange,label){return `<label class="dz" for="${id}"><input type="file" id="${id}" multiple accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.csv,.key,.png,.jpg,.jpeg,.zip" onchange="${onchange}"><span>＋ ${label}</span><small>PDF, Office, images, ZIP · max 3 MB each</small></label>`}
function stack(team,max=5){return `<span class="stack">${team.slice(0,max).map(m=>`<span class="av" title="${esc(m.name)}" style="background:${pcol(m.id)}">${esc(m.ini)}</span>`).join('')}</span>`}
const P=id=>S.projects.find(p=>p.id===id);
/* Netlify Forms: real submissions on the live site, silently skipped locally */
function sendForm(name,data){
  if(location.protocol==='file:')return Promise.resolve();
  return fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({'form-name':name,...data}).toString()}).catch(()=>{});
}

/* ================= nav ================= */
function renderNav(){
  const un=S.notes.filter(x=>!x.read).length,np=S.projects.length;
  $('#nav').innerHTML=`
   <span class="navlinks"><button onclick="jump('how')">How it works</button><button onclick="jump('team')">Team</button><button onclick="jump('pricing')">Pricing</button><button onclick="jump('cases')">Cases</button></span>
   <button class="${route==='projects'?'on':''}" onclick="go('projects')">My projects${np?' ('+np+')':''}</button>
   <div style="position:relative">
     <button class="avisos ${un?'':'none'}" onclick="toggleDrop(event)"><span class="dot">${un||''}</span>Avisos</button>
     <div class="drop" id="drop">${S.notes.length?S.notes.map(x=>`<div class="n ${x.read?'':'unread'}" onclick="openFromNote('${x.p||''}')">${esc(x.text)}<small>${ago(x.at)}</small></div>`).join(''):'<div class="empty">Nothing new yet.</div>'}</div>
   </div>
   <button class="cta" onclick="openSubmit()">Submit a challenge</button>`;
}
function toggleDrop(e){e.stopPropagation();const d=$('#drop');d.classList.toggle('open');if(d.classList.contains('open')){S.notes.forEach(x=>x.read=true);save();setTimeout(()=>{const b=$('.avisos');if(b){b.classList.add('none');b.querySelector('.dot').textContent=''}},600)}}
document.addEventListener('click',()=>{const d=$('#drop');if(d)d.classList.remove('open')});
function openFromNote(id){if(id&&P(id))openProject(id)}
function jump(id){if(route!=='home'){route='home';render()}closeSheet();setTimeout(()=>document.getElementById(id)?.scrollIntoView({behavior:'smooth'}),30)}

/* ================= routing ================= */
function go(r){route=r;render();window.scrollTo(0,0)}
function goHome(){closeDlg();closeChat();closeSheet();go('home')}
function resetDemo(){try{localStorage.removeItem('ebs_v1')}catch(e){}S=seed();goHome();toast('Demo data reset')}
function render(){renderNav();$('#view').innerHTML=route==='projects'?Projects():Home()}

/* ================= home ================= */

function pickCat(el){draft.category=el.dataset.c;document.querySelectorAll('.tagpick button').forEach(b=>b.classList.toggle('on',b===el));pv()}
function pickPkg(el){draft.pkg=el.dataset.k;document.querySelectorAll('.pkgpick button').forEach(b=>b.classList.toggle('on',b===el));pv()}
function upd(k,v){draft[k]=v;pv()}
function drawDraftFiles(){$('#draft-files').innerHTML=fileList(draft.files,'rmDraftFile');pv()}
function rmDraftFile(i){draft.files.splice(i,1);drawDraftFiles()}
const emailOk=e=>/.+@.+\..+/.test(e||'');
function pv(){
  const ok=draft.title.trim().length>5&&draft.context.trim().length>10&&draft.company.trim()&&draft.contact.trim()&&emailOk(draft.email)&&draft.ok;
  const b=$('#pub');if(b)b.disabled=!ok;
  const el=$('#pv');if(!el)return;
  const pk=PKG[draft.pkg];
  el.innerHTML=`<div class="tile ${col(draft.category)}" style="min-height:440px;pointer-events:none">
    <div><div class="tag">${esc(draft.category)}${draft.company?' · '+esc(draft.company):''}</div><h3>${esc(draft.title)||'<span style="opacity:.45">Your challenge goes here</span>'}</h3>
    <p style="font-size:18px;line-height:1.3;margin-top:14px;opacity:.85">${esc(draft.context)}</p>
    ${draft.outcome?`<p style="font-size:17px;margin-top:10px">Success: ${esc(draft.outcome)}</p>`:''}
    ${draft.files.length?`<p style="font-size:16px;margin-top:10px">📎 ${draft.files.length} file${draft.files.length>1?'s':''}</p>`:''}</div>
    <div class="b">${pk?`${pk.name} · ${eur(pk.price)}`:'Option: recommend one'}<br><span style="font-size:16px">Start: ${esc(draft.start)}</span></div></div>
    <p style="font-size:15px;color:var(--muted);margin-top:12px">${!emailOk(draft.email)?'Add your email to submit.':!draft.ok?'Tick the box to submit.':'Ready to submit.'}</p>`;
}
function submitChallenge(){
  const id='p'+Date.now(),pk=PKG[draft.pkg];
  S.projects.unshift({id,title:draft.title.trim(),category:draft.category,context:draft.context.trim(),outcome:draft.outcome.trim(),start:draft.start,pkg:draft.pkg,price:pk?pk.price:null,status:'review',created:Date.now(),files:draft.files,team:[],updates:[],chat:[],contact:{company:draft.company,name:draft.contact,email:draft.email,phone:draft.phone}});
  save();
  sendForm('challenge',{company:draft.company,contact:draft.contact,email:draft.email,phone:draft.phone,website:draft.website,size:draft.size,category:draft.category,title:draft.title,context:draft.context,outcome:draft.outcome,start:draft.start,package:pk?`${draft.pkg} ${pk.name} ${eur(pk.price)}`:'Not sure',files:draft.files.map(f=>f.name).join(', ')});
  closeSheet();route='projects';render();openSurvey(draft);
}

/* ================= validation survey ================= */
function openSurvey(d){
  $('#dlgbox').innerHTML=`
   <div class="survey">
    <h2>Thanks! Your challenge is in.</h2>
    <p>We’ll get back to you within 5 working days. While you’re here: 3 quick questions help us shape the Studio.</p>
    <label class="f">Would you pay €1,000 to have this challenge solved by an Elisava team?</label>
    ${['Yes','Maybe, depends on the proposal','No'].map(o=>`<label class="opt"><input type="radio" name="q1" value="${o}">${o}</label>`).join('')}
    <label class="f">How much would you be willing to pay for this project?</label>
    ${['Under €500','€500 to €1,000','€1,000 to €2,500','More than €2,500'].map(o=>`<label class="opt"><input type="radio" name="q2" value="${o}">${o}</label>`).join('')}
    <label class="f">What would make you trust Elisava with a real project?</label>
    ${['A professor leading the team','Seeing past cases','A contract and clear deliverables','Meeting the team first'].map(o=>`<label class="opt"><input type="radio" name="q3" value="${o}">${o}</label>`).join('')}
    <label class="f">Anything else? (optional)</label>
    <input class="in" id="q4" style="font-size:20px">
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:6px"><button class="btn" onclick="sendSurvey('${esc(d.company)}','${esc(d.email)}','${d.pkg}')">Send answers</button><button class="btn light" onclick="closeDlg();toast('Challenge submitted')">Skip</button></div>
   </div>`;
  $('#dlg').classList.add('open');
}
function sendSurvey(company,email,pkg){
  const v=n=>document.querySelector(`input[name=${n}]:checked`)?.value||'';
  sendForm('feedback',{company,email,pay_1000:v('q1'),would_pay:v('q2'),package_pref:pkg==='?'?'Not sure':pkg,trust:v('q3'),comment:$('#q4').value});
  closeDlg();toast('Thank you! Answers sent.');
}

function badge(p){return p.status==='done'?'<span class="badge" style="background:#fff;color:#111">Completed ✓</span>':p.status==='delivered'?'<span class="badge new">📄 Report in</span>':p.status==='proposal'?'<span class="badge new">Proposal ready</span>':p.status==='progress'?'<span class="badge">In progress</span>':'<span class="badge" style="background:#fff;color:#111">Under review</span>'}

  <div class="grid">
    <button class="tile ghost" onclick="openSubmit()"><h3>+ New challenge</h3><div class="b">Tell us the problem. We send a team and a proposal.</div></button>
    ${S.projects.map(p=>`<button class="tile ${col(p.category)}" onclick="openProject('${p.id}')">${badge(p)}<span class="tdel" title="Delete project" onclick="event.stopPropagation();askDelete('${p.id}')">🗑</span>
      <div><div class="tag">${esc(p.category)}</div><h3>${esc(p.title)}</h3></div>
      <div class="meta"><div class="b">${STAGES[stageIdx(p.status)][1]}<br>${p.price?eur(p.price):'Price in proposal'}${PKG[p.pkg]?' · '+PKG[p.pkg].name:''}</div>${p.team.length?stack(p.team):''}</div>
    </button>`).join('')}
  </div>`;
}
function stepper(p){const i=stageIdx(p.status);return `<div class="steps">${STAGES.map((s,j)=>`<div class="step ${j<i?'done':j===i?'now':''}">${s[1]}</div>`).join('')}</div>`}
function memberCard(m,pid,i){
  const rc=m.role==='Project leader'?'r-lead':m.role==='Alumni mentor'?'r-mentor':'r-student';
  return `<div class="person"><button class="p-top" onclick="openMember('${pid}',${i})"><span class="pav" style="background:${pcol(m.id)}">${esc(m.ini)}</span></button>
   <button class="p-body" onclick="openMember('${pid}',${i})"><h4>${esc(m.name)}</h4><p class="p-prog">${esc(m.prog)}</p><span class="role ${rc}">${esc(m.role)}</span>
   <div class="p-skills">${m.skills.slice(0,3).map(x=>`<span>${esc(x)}</span>`).join('')}</div></button>
   <div class="p-act"><button class="btn sm light" style="margin-top:0" onclick="openMember('${pid}',${i})">Profile & portfolio</button></div></div>`;
}
function openMember(pid,i){
  const m=P(pid).team[i];
  $('#dlgbox').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start"><span class="pav" style="background:${pcol(m.id)};width:96px;height:96px;font-size:32px">${esc(m.ini)}</span><button class="x" onclick="closeDlg()">✕</button></div>
   <h2 style="margin-top:18px">${esc(m.name)}</h2><p style="color:var(--muted);margin-top:6px">${esc(m.role)} · ${esc(m.prog)}</p><p>${esc(m.bio)}</p>
   <div class="p-skills" style="margin-top:14px">${m.skills.map(x=>`<span>${esc(x)}</span>`).join('')}</div>
   <label class="f">Portfolio</label><div class="pws">${(m.work||[]).map(w=>`<div class="pw c-${w[2]}"><b>${esc(w[0])}</b><small>${esc(w[1])}</small></div>`).join('')}</div>`;
  $('#dlg').classList.add('open');
}

  const p=P(id);if(!p)return;const sh=$('#sheet');sh.dataset.p=id;const pk=PKG[p.pkg];

  <div class="sheet-body one"><div>
    <div class="chips" style="margin:10px 0 0"><span class="chip ${col(p.category)}" style="border-color:transparent">${esc(p.category)}</span><span class="chip">${pk?pk.name+' · '+eur(p.price):'Option to be recommended'}</span><button class="chip del" onclick="askDelete('${p.id}')">🗑 Delete project</button></div>
    <h1 class="page" style="margin-top:22px">${esc(p.title)}</h1>
    ${stepper(p)}
    <p class="dl" style="margin-top:24px">${esc(p.context)}</p>
    ${p.outcome?`<p class="dl" style="margin-top:10px"><span style="color:var(--muted)">Success looks like:</span> ${esc(p.outcome)}</p>`:''}
    ${p.files.length?`<label class="f">Your files</label>${fileList(p.files)}`:''}

    ${p.status==='review'?`<div class="empty-box" style="color:var(--ink);margin-top:26px">Under review ✓ The Studio is reading your challenge. You’ll get a proposal with scope, price and your team within 5 working days.<br><button class="demo-link" onclick="simulateProposal('${p.id}')">Demo only: simulate the proposal arriving</button></div>`:''}
    ${p.status==='proposal'?proposalBlock(p):''}
    ${p.delivery?deliveryBlock(p):''}

    ${p.team.length?`<h2 style="font-weight:400;font-size:40px;letter-spacing:-.02em;margin:44px 0 16px">${p.status==='proposal'?'Proposed team':'Your team'}</h2><div class="team">${p.team.map((m,i)=>memberCard(m,p.id,i)).join('')}</div>`:''}

    ${p.updates.length?`<h2 style="font-weight:400;font-size:40px;letter-spacing:-.02em;margin:44px 0 6px">Weekly updates</h2>${p.updates.map(u=>`<div class="upd">${esc(u.text)}<small>${fmtDate(u.at)}</small></div>`).join('')}`:''}

    ${p.team.length?`<div style="margin-top:30px"><button class="btn light chatbtn" style="margin-top:0" onclick="openChat('${p.id}')">💬 Chat with ${esc(p.team[0].name)}${p.chat.length?' ('+p.chat.length+')':''}</button></div>`:''}
  </div></div>`;
  sh.classList.add('open');document.body.style.overflow='hidden';
}
function proposalBlock(p){
  const pr=p.proposal;
  return `<div class="proposal"><h5 style="font-weight:400;font-size:15px;color:var(--muted)">Proposal from Elisava Business Studio · ${ago(pr.at)}</h5>
   <h3>${eur(pr.price)} · ${pr.weeks} weeks · ${p.team.length} people</h3>
   <p style="font-size:19px;margin-top:10px;line-height:1.35">${esc(pr.scope)}</p>
   <ul>${pr.deliv.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>
   <label class="consent"><input type="checkbox" id="acc" onchange="$('#acc-go').disabled=!this.checked"><span>I accept the proposal and commit to pay <b>${eur(pr.price)}</b> to Elisava Business Studio, invoiced by Elisava.</span></label>
   <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="acc-go" disabled onclick="acceptProposal('${p.id}')">Accept & start project</button><button class="btn light" onclick="openChat('${p.id}')">Ask a question</button></div></div>`;
}
function deliveryBlock(p){
  return `<div class="delivery ${p.status==='done'?'ok':''}" style="margin-top:26px">
   <h5>${p.status==='done'?`Completed · paid ${fmtDate(p.paid)}`:'Delivered · waiting for your approval'}</h5>
   <h3>Final report from your team</h3><p>Delivered ${ago(p.delivery.at)}${p.delivery.note?` · “${esc(p.delivery.note)}”`:''}</p>
   ${fileList(p.delivery.files)}
   ${p.status==='delivered'?`<button class="btn" onclick="approve('${p.id}')">Approve delivery</button>`:''}</div>`;
}
function acceptProposal(id){const p=P(id);p.status='progress';p.started=Date.now();p.updates.push({at:Date.now(),text:'Proposal accepted. Kick-off meeting is being scheduled by your project leader.'});save();openProject(id);render();toast('Proposal accepted. Your project has started.')}
function approve(id){
  const p=P(id);
  $('#dlgbox').innerHTML=`<h2>Approve the delivery?</h2><p>You confirm the team delivered what was agreed. Elisava will send the final invoice of <b>${eur(p.price)}</b>.</p><div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" onclick="doApprove('${id}')">Approve</button><button class="btn light" onclick="closeDlg()">Not yet</button></div>`;
  $('#dlg').classList.add('open');
}
function doApprove(id){const p=P(id);p.status='done';p.paid=Date.now();save();closeDlg();openProject(id);render();toast('Delivery approved. Thank you!')}
function simulateProposal(id){
  const p=P(id),k=p.pkg==='?'?'A':p.pkg,pk=PKG[k];
  p.pkg=k;p.price=pk.price;p.status='proposal';
  p.team=k==='B'?[TEAM.lead,TEAM.mentor,TEAM.s1,TEAM.s2,TEAM.s3]:[TEAM.lead,TEAM.mentor,TEAM.s1,TEAM.s3];
  p.proposal={weeks:pk.weeks,price:pk.price,scope:'Based on your challenge we propose a '+pk.weeks+'-week '+pk.name+'. The team will start with research with your customers and work towards concrete recommendations.',deliv:pk.out,at:Date.now()};
  notify(`Your proposal for “${p.title}” is ready`,id);save();openProject(id);render();
}

/* ================= delete ================= */
function askDelete(id){
  const p=P(id);
  $('#dlgbox').innerHTML=`<h2>Delete this project?</h2><p>“${esc(p.title)}” will be removed with its files, updates and chat. This can’t be undone.</p>
   ${p.status==='progress'||p.status==='delivered'?'<p style="color:var(--red)">This project is running. Deleting it here does not cancel your agreement with Elisava. Talk to your project leader first.</p>':''}
   <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" style="background:var(--red)" onclick="doDelete('${id}')">Delete project</button><button class="btn light" onclick="closeDlg()">Cancel</button></div>`;
  $('#dlg').classList.add('open');
}
function doDelete(id){S.projects=S.projects.filter(p=>p.id!==id);S.notes=S.notes.filter(n=>n.p!==id);save();closeDlg();closeChat();closeSheet();render();toast('Project deleted')}

/* ================= chat ================= */
function openChat(id){chatCtx=id;chatFiles=[];drawChat();$('#chat').classList.add('open');setTimeout(()=>$('#chat-txt')?.focus(),50)}
function closeChat(){$('#chat').classList.remove('open');chatCtx=null}
function drawChat(){
  const p=P(chatCtx);const lead=p.team[0]||{name:'Elisava Business Studio'};
  $('#chat').innerHTML=`
   <div class="chat-head"><div><h3>${esc(lead.name)}</h3><p>${esc(p.title)}</p></div><button class="x" onclick="closeChat()">✕</button></div>
   <div class="msgs" id="msgs">${p.chat.length?p.chat.map(m=>`<div class="msg ${m.from==='company'?'me':''}">${esc(m.text).replace(/\n/g,'<br>')}${fileList(m.files)}<small>${m.from==='company'?'You':esc(m.name)} · ${ago(m.at)}</small></div>`).join(''):'<p style="color:var(--muted);font-size:17px">No messages yet. Ask about scope, timing or the team.</p>'}</div>
   <div class="pending" id="chat-pf"></div>
   <div class="chat-in">
     <label class="att" title="Attach file"><input type="file" multiple onchange="readFiles(this,f=>{chatFiles.push(f);$('#chat-pf').innerHTML=fileList(chatFiles,'rmChatFile')})">📎</label>
     <textarea id="chat-txt" placeholder="Write a message…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
     <button class="send" onclick="sendMsg()">Send</button>
   </div>`;
  const m=$('#msgs');m.scrollTop=m.scrollHeight;
}
function rmChatFile(i){chatFiles.splice(i,1);$('#chat-pf').innerHTML=fileList(chatFiles,'rmChatFile')}
function sendMsg(){
  const t=$('#chat-txt').value.trim();if(!t&&!chatFiles.length)return;
  const p=P(chatCtx);p.chat.push({from:'company',name:ME.contact,text:t,at:Date.now(),files:chatFiles});chatFiles=[];save();drawChat();
  setTimeout(()=>{if(!P(p.id))return;const lead=p.team[0];p.chat.push({from:'studio',name:lead?lead.name:'Elisava Business Studio',text:'Thanks! I’ll get back to you before our next check-in.',at:Date.now(),files:[]});save();if(chatCtx===p.id)drawChat()},1500);
}

/* ================= misc ================= */
function closeSheet(){$('#sheet').classList.remove('open');document.body.style.overflow=''}
function closeDlg(){$('#dlg').classList.remove('open')}
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')closeDlg()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#dlg').classList.contains('open'))closeDlg();else if($('#chat').classList.contains('open'))closeChat();else closeSheet()}});
render();
</script>
</body>
</html>
